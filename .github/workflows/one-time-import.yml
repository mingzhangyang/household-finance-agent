name: One-time Skill source import
on:
  push:
    branches: [feat/professional-model-foundation]
    paths: [".bootstrap/ready.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and check source paths
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, zlib
          from pathlib import Path
          raw = "".join(p.read_text() for p in sorted(Path(".bootstrap").glob("part*.txt")))
          data = json.loads(zlib.decompress(base64.b64decode(raw)))
          root = Path.cwd().resolve()
          for filename, content in data.items():
              target = (root / filename).resolve()
              if not target.is_relative_to(root) or ".git" in target.parts or ".bootstrap" in target.parts:
                  raise ValueError("unsafe import path")
              if not isinstance(content, str):
                  raise ValueError("expected text-only source")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          print(f"Imported {len(data)} source files")
          PY
      - name: Commit readable source and remove one-time bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -f .bootstrap .github/workflows/one-time-import.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: unpack reviewed finance Skill source into repository"
            git push
          fi

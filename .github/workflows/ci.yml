name: Professional model validation
on:
  push:
    branches: [main, feat/professional-model-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q scripts tests
      - name: Run self-contained professional modules
        run: python -m unittest discover -s tests -p 'test_professional_modules.py' -v
